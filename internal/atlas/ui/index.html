<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="Search technical knowledge, track experiments, write live docs with your lab and its agents, inspect system signals, and process research media.">
  <title>Atlas Research Console</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/libre-baskerville-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="#overview" aria-label="Atlas home">Atlas <span>Research</span></a>
      <nav class="primary-nav" aria-label="Workspace">
        <button class="nav-item" data-view="knowledge">Knowledge</button>
        <button class="nav-item" data-view="experiments">Experiments</button>
        <button class="nav-item" data-view="docs">Live docs</button>
        <button class="nav-item" data-view="signals">Signals</button>
      </nav>
    </header>
    <div class="statusline">
      <button id="runtimeButton" class="runtime"><i class="status-dot"></i><span><strong>Browser mode</strong><small>Stored on this device</small></span><span>›</span></button>
      <span id="systemState" class="system-state"><i class="status-dot"></i>No live runtime</span>
      <button class="secondary-link" data-view="media">Optional media tools</button>
      <button id="commandButton" class="command-button"><span>Go to</span><kbd>⌘K</kbd></button>
    </div>
    <main class="main">
      <div id="workspace" class="content" aria-live="polite"></div>
    </main>
    <footer class="site-foot">
      <div><a href="https://github.com/Manas2006/atlas-research" target="_blank" rel="noreferrer">GitHub</a></div>
      <div>Atlas Research Console</div>
    </footer>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="ot.js" defer></script>
  <script src="collab.js" defer></script>
  <script src="docs.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
