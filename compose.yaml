services:
  atlas:
    build:
      context: .
      target: atlas-runtime
    ports:
      - "8088:8088"
    volumes:
      - atlas-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8088/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  media-worker:
    profiles: ["media"]
    build:
      context: .
      target: media-runtime
    entrypoint: ["/usr/local/bin/video-worker"]
    command: ["-id", "compose-worker-1", "-api", "http://atlas:8088/api/video"]
    volumes:
      - atlas-data:/data
    depends_on:
      atlas:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas-data:
