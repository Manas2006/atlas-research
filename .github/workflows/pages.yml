name: deploy-console

on:
  push:
    branches: [main]
    paths:
      - 'internal/atlas/ui/**'
      - 'docs/drive-inventory.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check that the Drive inventory is redacted
        run: node --test internal/atlas/uitests/inventory.test.js
      - name: Add the public metadata-only Drive demo
        run: cp docs/drive-inventory.json internal/atlas/ui/drive-inventory.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: internal/atlas/ui
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
