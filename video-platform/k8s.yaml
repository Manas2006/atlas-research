apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: streamforge-worker}
  template:
    metadata:
      labels: {app: streamforge-worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/manas2006/atlas-research/video-worker:latest
          args: ["-api", "http://streamforge-api:6060"]
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamforge-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamforge-worker
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
